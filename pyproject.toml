[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-scholar-mcp"
version = "0.1.0"
description = "A custom Model Context Protocol (MCP) server for Google Scholar tools."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
license = {text = "MIT"}
dependencies = [
    "mcp",
    "fastmcp",
    "google-search-results",
    "scholarly",
    "bibtexparser<2.0.0",
    "httpx<0.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock"
]

[project.scripts]
custom-scholar = "google_scholar_mcp.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
